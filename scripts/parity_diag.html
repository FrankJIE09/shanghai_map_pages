<!DOCTYPE html>
<meta charset="utf-8">
<title>diag-loading</title>
<style>body{font:12px monospace;margin:6px}iframe{width:1280px;height:800px;border:1px solid #999}</style>
<body>
<pre id="out">running…</pre>
<iframe id="f" scrolling="no"></iframe>
<script>
// 同源 iframe 加载一张地图页，把关键 DOM 计数与「点开关后」的状态写进 document.title，
// 用于两个版本逐项对比（浏览器快照读不到 Leaflet 的文字，只能这样取数）。
// 步骤：初始 → 🛣️ 关/开 → 📍 关/开（有才点）→ 🚇 开面板 → 勾第 1 条线（bars 页才有）。
// 用法：_diag.html#shanghai_bars_livehouse_2026.html
// 注意：对比必须「同版本前后」，即两个目录放同一版本的产物、用同一份本探针分别跑；
// 拿旧产物当基线会把新增图层误判成回归。
const target = decodeURIComponent(location.hash.slice(1)) || 'shanghai_bars_livehouse_2026.html';
const f = document.getElementById('f');
const log = [];

function paneState(d, name) {
  // Leaflet createPane(name) 会做 name.replace('Pane','')，class 变成 "leaflet-pane leaflet-<name>-pane"
  const p = d.querySelector('.leaflet-pane.leaflet-' + name.replace('Pane', '') + '-pane');
  if (!p) return 'missing';
  return p.style.display === 'none' ? 'none' : 'shown';
}
function roadPaths(d) { return d.querySelectorAll('.leaflet-roads-pane svg path').length; }

// ---- 地铁图层探针 ----
// 地铁折线单独在 metroLinesPane 里，不在 roadsPane，所以不会被上面的 polylines 统计到，
// 这里给一个独立计数。
function metroLines(d) { return d.querySelectorAll('.leaflet-metroLines-pane svg path.metro-line').length; }

// 站点：DOM 里几个 / 几何可见几个，两个数必须分开看：
//   1) 未勾选任何线路时，站点 marker 根本没进 DOM（只在被勾线路入图后才 addLayer），不是 CSS 隐藏；
//   2) pane 自身 display:none 时，子元素的 getComputedStyle().display 仍返回它自己的值，
//      所以必须先判 pane 是否展示，再逐元素查 display（z13 的 hide-minor 正是后者的效果）。
function metroStationStats(d) {
  const all = Array.from(d.querySelectorAll('.metro-station'));
  const pane = d.querySelector('.metro-stations-pane');
  const paneShown = !!pane && pane.style.display !== 'none';
  const hideMinor = !!pane && pane.classList.contains('hide-minor');
  let visible = 0;
  if (paneShown) {
    all.forEach(function (el) { if (getComputedStyle(el).display !== 'none') visible++; });
  }
  return {
    dom: all.length,
    visible: visible,
    transfer: all.filter(function (el) { return el.classList.contains('transfer'); }).length,
    hideMinor: hideMinor
  };
}

function openMetroPanel(d) {
  const a = d.querySelector('.metro-ctl .leaflet-bar a');
  if (!a) return false;          // 只有 bars 页有 🚇
  a.click();
  return true;
}
function clickMetroLine(d, idx) {
  const chip = d.querySelectorAll('[data-metro-chips] [data-line]')[idx || 0];
  if (!chip) return false;
  chip.click();
  return true;
}

// 在 iframe 页面自己的作用域里求值。页面顶层的 `let map` 属于全局词法环境，
// 后续注入的 <script> 能直接引用它（但外部拿不到 w.map，属性上并不存在）。
function evalInPage(d, w, expr) {
  const s = d.createElement('script');
  s.textContent = 'window.__ev = (function(){ try { return JSON.stringify(' + expr + '); } catch (e) { return "ERR " + e.message; } })();';
  d.body.appendChild(s);
  const out = w.__ev;
  s.remove();
  delete w.__ev;
  return out;
}

function tileInfo(d) {
  const img = d.querySelector('.leaflet-tile-pane img');
  const src = img ? img.src : '';
  const m = src.match(/cartocdn\.com\/([a-z_]+)\/(\d+)\//);
  const a = d.querySelector('.leaflet-control-attribution');
  const attr = a ? a.textContent.replace(/\s+/g, ' ').trim().slice(0, 46) : 'no-attr';
  return (m ? m[1] + '/firstTileZ' + m[2] : 'n/a') + ' attr[' + attr + ']';
}
function listSelOf(d) { return d.querySelector('#venue-list') ? '#venue-list' : '#rest-list'; }

function snap(tag) {
  const d = f.contentDocument;
  const q = s => d.querySelectorAll(s).length;
  const ms = metroStationStats(d);
  return [
    tag,
    'polylines=' + roadPaths(d),
    'road_labels=' + q('.road-name'),
    'road_major=' + q('.road-name-major'),
    'areas=' + q('.area-label'),
    'origin=' + q('.area-label.origin'),
    'pois=' + q('.poi-name'),
    'icons=' + q('.m-icon'),
    'bars=' + q('.leaflet-bar'),
    'tile=' + tileInfo(d),
    'mapstate=' + evalInPage(d, f.contentWindow, '({z: map.getZoom(), size: map.getSize().x + "x" + map.getSize().y, c: map.getCenter().lat.toFixed(4) + "," + map.getCenter().lng.toFixed(4), b: map.getBounds().toBBoxString().split(",").map(function(n){return (+n).toFixed(3);}).join(","), minz: map.getMinZoom(), maxz: map.getMaxZoom()})'),
    'paneRoadA=' + paneState(d, 'roadLabelsPaneA'),
    'paneRoadB=' + paneState(d, 'roadLabelsPaneB'),
    'paneArea=' + paneState(d, 'areaLabelsPane'),
    'panePoi=' + paneState(d, 'landmarksPane'),
    'paneMetroLines=' + paneState(d, 'metroLinesPane'),
    'paneMetroStations=' + paneState(d, 'metroStationsPane'),
    // 地铁：DOM 计数 vs 几何可见计数分开报
    'metro_lines=' + metroLines(d),
    'metro_stations=' + ms.dom,
    'metro_stations_visible=' + ms.visible,
    'metro_stations_transfer=' + ms.transfer,
    'metro_hide_minor=' + ms.hideMinor,
    'metro_chips=' + q('[data-metro-chips] [data-line]'),
    'metro_chips_active=' + q('[data-metro-chips] [data-line].active'),
    'metro_stat=' + JSON.stringify(((d.querySelector('[data-metro-stat]') || {}).textContent || 'n/a').trim()),
    'list=' + q(listSelOf(d) + ' > *'),
    'count=' + JSON.stringify(((d.getElementById('list-count') || {}).textContent || 'n/a').trim()),
    'panes=' + JSON.stringify(Array.from(d.querySelectorAll('.leaflet-map-pane .leaflet-pane')).map(e => e.className.replace('leaflet-pane ', '').replace('leaflet-', '').replace('-pane', ''))),
    'tiles=' + d.querySelectorAll('.leaflet-tile-pane img').length,
  ].join(' ');
}

function clickToggle(d, title) {
  const a = d.querySelector('.leaflet-bar a[title="' + title + '"]');
  if (!a) return false;
  a.click();
  return true;
}

function finish(tag) {
  document.title = 'DIAG[' + tag + '] ' + log.join('  ##  ');
  document.getElementById('out').textContent = log.join('\n\n');
}

function run() {
  const d = f.contentDocument;
  if (!d) { document.title = 'DIAGERR no contentDocument'; return; }
  try {
    log.push(snap('initial'));
    if (clickToggle(d, '显示 / 隐藏道路骨架')) log.push(snap('roads_off'));
    if (clickToggle(d, '显示 / 隐藏道路骨架')) log.push(snap('roads_on'));
    if (clickToggle(d, '显示 / 隐藏地标参照')) log.push(snap('poi_off'));
    if (clickToggle(d, '显示 / 隐藏地标参照')) log.push(snap('poi_on'));
    // 地铁（只有 bars 页有 🚇）：开面板 → 勾第 1 条线，再各读一轮
    if (openMetroPanel(d)) log.push(snap('metro_open'));
    if (clickMetroLine(d, 0)) log.push(snap('metro_line1'));
  } catch (e) {
    log.push('ERR ' + e.message);
  }
  finish('t' + new Date().getTime() % 100000);
  // 再测一次：fitBounds 的落点依赖容器尺寸，首次测量可能撞上布局未稳，晚测可判断是否只是竞态
  setTimeout(function () {
    try {
      log.push(snap('late'));
      document.getElementById('out').textContent = log.join('\n\n');
      document.title = 'DIAG[' + (new Date().getTime() % 100000) + '] ' + log.join('  ##  ');
    } catch (e) { /* 忽略 */ }
  }, 3500);
}

f.addEventListener('load', function () { setTimeout(run, 1500); });
f.src = target;
setTimeout(function () { if (document.title === 'diag-loading') run(); }, 6000);
</script>
</body>
