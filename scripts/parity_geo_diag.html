<!DOCTYPE html>
<meta charset="utf-8">
<title>geo-diag-loading</title>
<style>body{font:12px monospace;margin:6px}iframe{width:1280px;height:820px;border:1px solid #999}</style>
<body>
<pre id="out">running…</pre>
<iframe id="f" scrolling="no"></iframe>
<script>
// 定位流程对比探针：伪造 navigator.geolocation 后依次点 🧭 / 📏 / ✕，
// 每步记录提示条文案、按钮状态、我的位置标记数、精度圆数、名录前三项。
// 用法：_geo_diag.html#shanghai_bichi_saojie_2026.html
const target = decodeURIComponent(location.hash.slice(1)) || 'shanghai_bichi_saojie_2026.html';
const f = document.getElementById('f');
const log = [];

const FIX = { coords: { latitude: 31.2304, longitude: 121.4737, accuracy: 35 } };

function stubGeo(w) {
  let asked = 0;
  const gp = w.navigator.geolocation;
  Object.defineProperty(w.navigator, 'geolocation', {
    configurable: true,
    value: {
      getCurrentPosition(ok) { asked++; ok(FIX); },
      watchPosition() { return 1; },
      clearWatch() {},
      _asked: () => asked
    }
  });
  return gp;
}

function listSel(d) { return d.querySelector('#venue-list') ? '#venue-list' : '#rest-list'; }

/** 详情卡底部链接现在落在哪个百度端点上：marker / direction / place-detail / place-search。
    旧探针只看 `api.map.baidu.com/navigation?`（上古写法），早就不适用了，这里跟着
    src/static/venue-links.js 的实际取值改掉，免得回归时读到假的 'marker-mode'。 */
function endpoint(d, id) {
  const el = d.getElementById(id);
  if (!el || !el.href) return 'none';
  const m = /api\.map\.baidu\.com\/([a-z/]+)\?/.exec(el.href);
  if (m) return m[1].replace('/', '-');
  return el.href.indexOf('j.map.baidu.com') >= 0 ? 'short-link' : 'other';
}

function firstItems(d) {
  const el = d.querySelector(listSel(d));
  if (!el) return 'none';
  return Array.from(el.children).slice(0, 3).map(function (c) {
    return (c.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 26);
  }).join(' | ');
}

function snap(tag) {
  const d = f.contentDocument, w = f.contentWindow;
  const q = s => d.querySelectorAll(s).length;
  const g = w.navigator.geolocation;
  const clr = d.getElementById('locate-clear');
  const sb = d.getElementById('sort-dist');
  const hint = d.getElementById('map-hint');
  return [
    tag,
    'hint=' + JSON.stringify((hint ? hint.textContent : 'none').replace(/\s+/g, ' ').slice(0, 58)),
    'hintColor=' + (hint ? hint.style.color || '-' : '-'),
    'clear=' + (clr ? (clr.style.display === 'none' ? 'hidden' : clr.style.display || 'default') : 'none'),
    'sort=' + (sb ? JSON.stringify(sb.textContent) + (sb.classList.contains('active') ? '+active' : '') : 'none'),
    '    dots=' + q('.user-dot'),
    'circles=' + q('.leaflet-overlay-pane svg path'),
    'markers=' + q('.leaflet-marker-pane > *'),
    'asked=' + (g && g._asked ? g._asked() : 'n/a'),
    'nav=' + JSON.stringify(((d.getElementById('detail-nav') || {}).textContent || 'none').trim()),
    'navHref=' + endpoint(d, 'detail-nav'),
    'poiHref=' + endpoint(d, 'detail-poi'),
    'linkRow=' + (function (row) {
      return row ? (getComputedStyle(row).display === 'none' ? 'hidden' : 'shown') : 'missing';
    })(d.getElementById('detail-links')),
    'first3=' + JSON.stringify(firstItems(d)),
  ].join(' ');
}

function click(d, id) {
  const el = d.getElementById(id);
  if (!el) return false;
  el.click();
  return true;
}

function run() {
  const d = f.contentDocument, w = f.contentWindow;
  if (!d) { document.title = 'GEOERR no contentDocument'; return; }
  try {
    log.push(snap('0_initial'));
    stubGeo(w);
    click(d, 'locate-btn');
    log.push(snap('1_located'));
    click(d, 'sort-dist');
    log.push(snap('2_sort_on'));
    click(d, 'sort-dist');
    log.push(snap('3_sort_off'));
    click(d, 'locate-clear');
    log.push(snap('4_cleared'));

    // 再定位一次并点开一家店：详情卡里的导航按钮应变成「步行导航到店」
    click(d, 'locate-btn');
    const ms = Array.from(d.querySelectorAll('.leaflet-marker-pane > *'));
    let picked = false;
    for (let i = 0; i < ms.length && !picked; i++) {
      ms[i].dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: w }));
      if ((d.getElementById('detail-title') || {}).textContent) picked = true;
    }
    log.push(snap('5_detail_after_locate'));
  } catch (e) {
    log.push('ERR ' + e.message);
  }
  document.title = 'GEO[' + target.slice(11, 20) + '] ' + log.join('  ##  ');
  document.getElementById('out').textContent = log.join('\n\n');
}

f.addEventListener('load', function () { setTimeout(run, 1800); });
f.src = target;
setTimeout(function () { if (document.title === 'geo-diag-loading') run(); }, 7000);
</script>
</body>
